[package]
name = "tier-drop-worker"
description = "Hosted MCP server for model-tier-drop on Cloudflare Workers (workers-rs)."
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/bradheitmann/model-tier-drop"

# Detached from the root workspace: this crate targets wasm32-unknown-unknown and is built by worker-build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
tier-drop-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
