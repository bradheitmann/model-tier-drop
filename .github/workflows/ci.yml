name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --all --check --manifest-path crates/worker/Cargo.toml
      - run: cargo test --manifest-path crates/worker/Cargo.toml
      - name: worker (wasm32) clippy
        run: cargo clippy --manifest-path crates/worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: worker build
        run: |
          cargo install worker-build --locked
          cd crates/worker && worker-build --release
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.98.1
      - run: cargo build -p tier-drop-cli
      - run: pnpm --dir adapters/dsh install --frozen-lockfile
      - run: pnpm --dir adapters/dsh check
  # Charter check (pattern C, template v2). Non-required while the charter
  # source is unreachable from this runner: it then prints a typed "charter not
  # run" line and passes. When the source is reachable it installs the pinned
  # commit and enforces `check --strict` with no edit here. Local hooks and the
  # pre-push `check --strict` enforce Charter meanwhile.
  charter:
    name: charter (non-required while the charter source is unreachable)
    runs-on: ubuntu-latest
    env:
      CHARTER_REV: 7b12eeaf8c4d734386a863dc01c06da6c7ac4cb8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0  # strict checks that STATE's recorded HEAD exists
      - name: probe the charter source
        id: probe
        run: |
          if GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP" ls-remote --exit-code https://github.com/bradheitmann/charter HEAD >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "charter not run: charter source unreachable from this runner"
          fi
      - if: steps.probe.outputs.reachable == 'true'
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          toolchain: 1.88.0
      - if: steps.probe.outputs.reachable == 'true'
        name: charter check --strict at the pinned commit
        run: |
          cargo +1.88.0 install --locked --git https://github.com/bradheitmann/charter --rev "$CHARTER_REV" charter
          charter --version | grep -F "($CHARTER_REV)"
          charter check --strict
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
