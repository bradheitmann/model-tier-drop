name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --all --check --manifest-path crates/worker/Cargo.toml
      - run: cargo test --manifest-path crates/worker/Cargo.toml
      - name: worker (wasm32) clippy
        run: cargo clippy --manifest-path crates/worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: worker build
        run: |
          cargo install worker-build --locked
          cd crates/worker && worker-build --release
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: cargo build -p tier-drop-cli
      - run: pnpm --dir adapters/dsh install --frozen-lockfile
      - run: pnpm --dir adapters/dsh check
  # Charter (fleet pattern C, A/EXEC-PM ruling 2026-11-01). Non-required while
  # bradheitmann/charter is private: it prints a typed "not run" line instead of
  # failing. The day the repo becomes reachable it installs the pinned commit and
  # enforces `check --strict` with no edit here. Local hooks and the pre-push
  # `check --strict` enforce Charter meanwhile. Keep this job OUT of the required
  # checks until the owner's decision lands.
  charter:
    name: charter (non-required until the charter repo is public)
    runs-on: ubuntu-latest
    env:
      CHARTER_REV: 8610d51bed10fc3645efcbc38d3f2465fe04174a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # strict checks that STATE's recorded HEAD exists
      - name: probe the charter repo
        id: probe
        run: |
          if GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP" ls-remote --exit-code https://github.com/bradheitmann/charter HEAD >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "charter not run: repo private (owner decision pending)"
          fi
      - if: steps.probe.outputs.reachable == 'true'
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759  # 1.88.0
        with:
          toolchain: 1.88.0
      - if: steps.probe.outputs.reachable == 'true'
        name: charter check --strict at the pinned commit
        run: |
          cargo +1.88.0 install --locked --git https://github.com/bradheitmann/charter --rev "$CHARTER_REV" charter
          charter --version | grep -F "($CHARTER_REV)"
          charter check --strict
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
