name: audit
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10
      - run: cargo install cargo-audit --locked --version 0.22.1
      - name: cargo audit (root workspace)
        run: cargo audit
      - name: cargo audit (worker)
        run: cargo audit --file crates/worker/Cargo.lock
      - name: pnpm audit (dsh adapter)
        run: pnpm --dir adapters/dsh audit --prod --audit-level high
